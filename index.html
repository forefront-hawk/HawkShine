<script>

var FONTS={
  system:'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif',
  calibri:'Calibri,"Segoe UI",Candara,sans-serif',
  arial:'Arial,"Helvetica Neue",Helvetica,sans-serif',
  inter:'"Inter",system-ui,sans-serif',
  serif:'Georgia,"Times New Roman",Times,serif',
  mono:'"JetBrains Mono",Consolas,ui-monospace,monospace',
  space:'"Space Grotesk",system-ui,sans-serif',
  orbitron:'"Orbitron",system-ui,sans-serif',
  pixel:'"Press Start 2P",ui-monospace,monospace'
};
var ACC={sky:"#38BDF8",gold:"#D4AF37",green:"#34D399",amber:"#FBBF24",rose:"#FB7185",violet:"#A78BFA"};
var OVERLAY_LIST=[
  ["ui-sophisticated","★ Sophisticated (ForefrontHawk)"],
  ["ui-tech","★ Tech (CAD Telemetry)"],
  ["ui-futuristic","★ Futuristic (Holo-Glass)"],
  ["none","0. Classic UI"],["mech-ibm","1. IBM Model M"],["mech-c64","2. Commodore 64"],
  ["mech-cyber","3. Cyber Neon"],["mech-typewriter","4. Typewriter"],["mech-arcade","5. Arcade Sanwa"],
  ["plug-vst","6. VST Rack"],["plug-eurorack","7. Eurorack"],["plug-mpc","8. Akai MPC"],
  ["plug-dmx","9. GrandMA DMX"],["plug-davinci","10. DaVinci Panel"],["app-winamp","11. Winamp 2.x"],
  ["app-ps3","12. Photoshop 3"],["app-lotus","13. Lotus 1-2-3"],["app-soundforge","14. FastTracker"],
  ["app-hypercard","15. HyperCard"],["os-win95","16. Windows 95"],["os-winxp","17. Windows XP"],
  ["os-mac9","18. Mac OS 9"],["os-amiga","19. AmigaOS 1.3"],["os-pipboy","20. CRT Pip-Boy"]
];

var UI_STATE={
  mode:"dark",overlay:"ui-sophisticated",font:"system",accent:"gold",
  cBg:"#090B10",cPanel:"#121620",cText:"#F8FAFC",cPlate:"#181D2A",
  activeColor:"#10B981",activeLabel:"GRN"
};

var suiteChan=null,chromaChan=null;
try{
  if(typeof BroadcastChannel!=="undefined"){
    suiteChan=new BroadcastChannel("forefronthawk_suite_bus");
    chromaChan=new BroadcastChannel("hawkchroma_2x10_bus");
  }
}catch(e){}

var chromaPopupWin=null;

function readRootDomainCookie(){
  try{
    var m=document.cookie.match(/(?:^|;\s*)ffh_ui=([^;]+)/);
    if(m&&m[1])return JSON.parse(decodeURIComponent(m[1]));
  }catch(e){}
  return null;
}

function writeRootDomainCookie(obj){
  try{
    var val=encodeURIComponent(JSON.stringify(obj));
    // Set onboth .forefronthawk.com (travels across chroma, draw, shine, rgb subdomains!) and current host
    document.cookie="ffh_ui="+val+"; domain=.forefronthawk.com; path=/; max-age=31536000; SameSite=Lax";
    document.cookie="ffh_ui="+val+"; path=/; max-age=31536000; SameSite=Lax";
  }catch(e){}
}

function readUrlHashState(){
  try{
    if(location.hash&&location.hash.indexOf("ffh=")>-1){
      var part=location.hash.split("ffh=")[1].split("&")[0];
      return JSON.parse(decodeURIComponent(part));
    }
  }catch(e){}
  return null;
}

function updateSubdomainBannerLinks(){
  try{
    writeRootDomainCookie(UI_STATE);
    document.querySelectorAll("a.sub-link").forEach(function(a){
      var base=a.dataset.sub||a.getAttribute("href").split("#")[0];
      a.href=base;
      var btn=a.querySelector("button");
      if(btn){
        btn.onclick=function(e){
          e.preventDefault();
          writeRootDomainCookie(UI_STATE);
          window.top.location.href=base;
        };
      }
    });
  }catch(e){}
}

function loadSharedUi(){
  try{
    var fromHash=readUrlHashState();
    var fromCookie=readRootDomainCookie();
    var fromLs=JSON.parse(localStorage.getItem("forefronthawk_shared_ui")||localStorage.getItem("hawkchroma_v4")||"null");
    var sv=fromHash||fromCookie||fromLs;
    if(sv){
      if(sv.mode)UI_STATE.mode=sv.mode;
      if(sv.overlay)UI_STATE.overlay=sv.overlay;
      if(sv.font)UI_STATE.font=sv.font;
      if(sv.accent)UI_STATE.accent=sv.accent;
      if(sv.cBg)UI_STATE.cBg=sv.cBg;
      if(sv.cPanel)UI_STATE.cPanel=sv.cPanel;
      if(sv.cText)UI_STATE.cText=sv.cText;
      if(sv.cPlate)UI_STATE.cPlate=sv.cPlate;
      if(sv.activeColor||sv.shown||sv.hex)UI_STATE.activeColor=sv.activeColor||sv.shown||sv.hex;
      if(fromHash)writeRootDomainCookie(UI_STATE);
    }
  }catch(e){}
  applySharedUiToDom();
  updateSubdomainBannerLinks();
}

function saveAndBroadcastUi(broadcast){
  try{
    localStorage.setItem("forefronthawk_shared_ui",JSON.stringify(UI_STATE));
    writeRootDomainCookie(UI_STATE);
    updateSubdomainBannerLinks();
    var hc=JSON.parse(localStorage.getItem("hawkchroma_v4")||"{}");
    hc.mode=UI_STATE.mode;hc.overlay=UI_STATE.overlay;hc.font=UI_STATE.font;
    hc.cBg=UI_STATE.cBg;hc.cPanel=UI_STATE.cPanel;hc.cText=UI_STATE.cText;hc.cPlate=UI_STATE.cPlate;
    hc.shown=UI_STATE.activeColor;hc.hex=UI_STATE.activeColor;
    localStorage.setItem("hawkchroma_v4",JSON.stringify(hc));
  }catch(e){}
  applySharedUiToDom();
  if(broadcast){
    if(suiteChan){try{suiteChan.postMessage({type:"FFH_UI_SYNC",ui:UI_STATE})}catch(e){}}
    if(window.opener){try{window.opener.postMessage({type:"FFH_UI_SYNC",ui:UI_STATE},"*")}catch(e){}}
    if(chromaPopupWin&&!chromaPopupWin.closed){try{chromaPopupWin.postMessage({type:"FFH_UI_SYNC",ui:UI_STATE},"*")}catch(e){}}
  }
}

function applySharedUiToDom(){
  var r=document.documentElement;
  r.setAttribute("data-theme",UI_STATE.mode||"dark");
  if(UI_STATE.overlay&&UI_STATE.overlay!=="none")r.setAttribute("data-ov",UI_STATE.overlay);
  else r.removeAttribute("data-ov");
  r.style.setProperty("--font",FONTS[UI_STATE.font]||FONTS.system);
  r.style.setProperty("--accent",ACC[UI_STATE.accent]||"#D4AF37");
  if(UI_STATE.mode==="custom_live"){
    r.style.setProperty("--bg",UI_STATE.cBg);
    r.style.setProperty("--panel",UI_STATE.cPanel);
    r.style.setProperty("--text",UI_STATE.cText);
    r.style.setProperty("--plate",UI_STATE.cPlate);
  }else{
    r.style.removeProperty("--bg");r.style.removeProperty("--panel");
    r.style.removeProperty("--text");r.style.removeProperty("--plate");
  }
  r.style.setProperty("--active-c",UI_STATE.activeColor);
  var sw=document.getElementById("chromaLiveSwatch");
  if(sw){
    sw.style.background=UI_STATE.activeColor;
    sw.textContent=UI_STATE.activeColor+" ("+UI_STATE.activeLabel+")";
  }
  if(document.getElementById("sharedOverlaySel"))document.getElementById("sharedOverlaySel").value=UI_STATE.overlay;
  if(document.getElementById("sharedThemeSel"))document.getElementById("sharedThemeSel").value=UI_STATE.mode;
  if(document.getElementById("sharedFontSel"))document.getElementById("sharedFontSel").value=UI_STATE.font;
  if(typeof onChromaColorReceived==="function")onChromaColorReceived(UI_STATE.activeColor,UI_STATE.activeLabel);
}

function initSharedCustomizerBar(){
  var popBtn=document.getElementById("openChromaPopupBtn");
  if(popBtn){
    popBtn.onclick=function(){
      var payload=encodeURIComponent(JSON.stringify(UI_STATE));
      writeRootDomainCookie(UI_STATE);
      chromaPopupWin=window.open("https://chroma.forefronthawk.com","HawkChromaCompanion","width=520,height=760");
    };
  }
  window.addEventListener("message",function(e){
    if(!e.data)return;
    if(e.data.type==="FFH_UI_SYNC"&&e.data.ui){
      Object.assign(UI_STATE,e.data.ui);
      saveAndBroadcastUi(false);
    }else if(e.data.hex){
      UI_STATE.activeColor=e.data.hex.toUpperCase();
      UI_STATE.activeLabel=e.data.label||"CHROMA";
      saveAndBroadcastUi(false);
    }
  });
  // Poll .forefronthawk.com root cookie every 800ms so separate tabs on chroma.forefronthawk.com and draw/shine/rgb.forefronthawk.com sync live without needing a popup!
  var lastCookieJson="";
  setInterval(function(){
    var ck=readRootDomainCookie();
    if(ck){
      var j=JSON.stringify(ck);
      if(j!==lastCookieJson){
        lastCookieJson=j;
        Object.assign(UI_STATE,ck);
        applySharedUiToDom();
      }
    }

var groupColors=["#D4AF37","#10B981","#38BDF8"];
function onChromaColorReceived(hex){
  var sel=document.getElementById("fixtureGroupSel");
  if(!sel)return;
  if(sel.value==="all")groupColors=[hex,hex,hex];
  else groupColors[+sel.value||0]=hex;

(function(){
  var cv=document.getElementById("shineCanvas"),ctx=cv.getContext("2d");
  var geo="fan",bpm=128,haze=0.75,strobe=false,tick=0;

  document.querySelectorAll("#laserGeoSeg button").forEach(function(b){
    b.onclick=function(){
      geo=b.dataset.g;
      document.querySelectorAll("#laserGeoSeg button").forEach(function(x){x.setAttribute("aria-pressed",x===b)});
    };
  });
  document.getElementById("assignChromaToGroupBtn").onclick=function(){
    onChromaColorReceived(UI_STATE.activeColor||"#10B981");
  };
  document.getElementById("shineBpmRange").oninput=function(){bpm=+this.value};
  document.getElementById("shineHazeRange").oninput=function(){haze=+this.value/100};
  document.getElementById("shineStrobeBtn").onclick=function(){
    strobe=!strobe;this.textContent=strobe?"⚡ Strobe: ON":"⚡ Strobe: Off";
  };

  function renderShow(){
    tick+=(bpm/120)*0.035;
    ctx.fillStyle="rgba(3, 5, 9, "+(1-haze*0.65)+")";
    ctx.fillRect(0,0,cv.width,cv.height);

    // Draw Overhead Truss
    ctx.strokeStyle="#334155";ctx.lineWidth=3;
    ctx.strokeRect(40,18,cv.width-80,14);

    if(strobe&&Math.floor(tick*20)%2===0){
      ctx.fillStyle="rgba(255,255,255,0.22)";
      ctx.fillRect(0,0,cv.width,cv.height);
    }

    // 8 Moving Head Fixtures + 3 ILDA Laser Projectors
    for(var i=0;i<8;i++){
      var fx=95+i*130,fy=32;
      var gIdx=i<3?0:i<5?1:2;
      var col=groupColors[gIdx]||"#10B981";
      var pan=Math.sin(tick+(i*0.6))*160;
      var tx=fx+pan,ty=cv.height-20;

      var grad=ctx.createLinearGradient(fx,fy,tx,ty);
      grad.addColorStop(0,col);
      grad.addColorStop(1,"transparent");
      ctx.fillStyle=grad;
      ctx.globalAlpha=haze*0.48;
      ctx.beginPath();
      ctx.moveTo(fx-8,fy);ctx.lineTo(fx+8,fy);
      ctx.lineTo(tx+95,ty);ctx.lineTo(tx-95,ty);
      ctx.closePath();ctx.fill();

      // Laser Geometry Overlay
      ctx.globalAlpha=0.95;
      ctx.strokeStyle=col;ctx.lineWidth=2;
      if(geo==="fan"){
        for(var ray=-4;ray<=4;ray++){
          ctx.beginPath();ctx.moveTo(fx,fy);
          ctx.lineTo(tx+ray*32,ty);ctx.stroke();
        }
      }else if(geo==="tunnel"&&i%2===0){
        ctx.beginPath();
        var r=45+Math.sin(tick*2+i)*25;
        ctx.arc(tx,cv.height*0.62,r,0,Math.PI*2);
        ctx.stroke();
      }else if(geo==="lissajous"&&i>=2&&i<=5){
        ctx.beginPath();
        for(var t=0;t<Math.PI*2;t+=0.1){
          var lx=tx+Math.sin(3*t+tick)*85;
          var ly=cv.height*0.58+Math.sin(4*t)*55;
          if(t===0)ctx.moveTo(lx,ly);else ctx.lineTo(lx,ly);
        }
        ctx.stroke();
      }

      // Fixture Head LED
      ctx.fillStyle=col;
      ctx.beginPath();ctx.arc(fx,fy,7,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
    requestAnimationFrame(renderShow);
  }

  initSharedCustomizerBar();
  loadSharedUi();
  requestAnimationFrame(renderShow);
})();
</script>
